<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Pack: GCP Onboarding Console</title>
    <script>
      // The stored theme, applied before first paint so the console never
      // flashes the wrong palette. Dark is the default; the shell keeps this
      // attribute in sync when the operator toggles.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('console-theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <!-- IBM Plex, swapped in when it arrives. display=swap keeps the font host
         off the critical path: a blocked or slow fetch costs letterforms, not
         the console. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
